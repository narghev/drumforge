<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Drumforge OG (build-tool)</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #FFCA28;
      }
      .og {
        width: 1200px;
        height: 630px;
        position: relative;
        background: #FFCA28;
        color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
        padding: 72px 88px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        font-size: 26px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(26, 26, 26, 0.7);
        font-weight: 600;
      }
      .title {
        font-size: 76px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.02em;
        margin-top: 28px;
        color: #0f172a;
        max-width: 900px;
      }
      .tagline {
        font-size: 30px;
        font-weight: 400;
        line-height: 1.4;
        color: rgba(15, 23, 42, 0.78);
        margin-top: 26px;
        max-width: 880px;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }
      .domain {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #0f172a;
      }
      .staff {
        font-size: 140px;
        line-height: 1;
        /* Apple Color Emoji renders best at this size */
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div>
        <div class="brand">Drumforge</div>
        <div class="title">Interactive drum exercises in your browser</div>
        <div class="tagline">
          Scrolling notation, BPM control, randomization, and a built-in practice timer.
        </div>
      </div>
      <div class="footer">
        <div>
          <div class="domain" style="margin-top: 18px;">drumforge.app</div>
        </div>
        <div class="staff">🥁</div>
      </div>
    </div>
  </body>
</html>
